name: OCI Ampere Launcher

on:
  workflow_dispatch:

  schedule:
    # Ejecuta una nueva ronda cada 6 horas.
    # GitHub Actions utiliza UTC para los cron.
    - cron: "17 */4 * * *"

concurrency:
  group: oci-ampere-launcher
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  INSTANCE_NAME: ampere-free

  OCI_SHAPE: VM.Standard.A1.Flex
  OCI_OCPUS: "2"
  OCI_MEMORY_GB: "12"
  OCI_BOOT_VOLUME_GB: "180"

  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

jobs:
  launch:
    name: Try to get Ampere A1
    runs-on: ubuntu-latest

    # El máximo de GitHub-hosted runners es 6 horas.
    # Dejamos margen para finalizar correctamente.
    timeout-minutes: 330

    steps:
      # =========================================================
      # COMPROBAR QUE EL REPOSITORIO ES PÚBLICO
      # =========================================================

      - name: Ensure repository is public
        shell: bash
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail

          if [ "$REPOSITORY_PRIVATE" = "true" ]; then
            echo "::error::Este workflow está diseñado para ejecutarse en un repositorio público."
            echo "::error::En un repositorio privado consumiría minutos de GitHub Actions."
            exit 1
          fi

          echo "Repositorio público: OK"

      # =========================================================
      # VALIDAR SECRETS
      # =========================================================

      - name: Validate secrets
        shell: bash
        env:
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          missing=0

          for var in \
            OCI_AVAILABILITY_DOMAIN \
            OCI_COMPARTMENT_ID \
            OCI_FINGERPRINT \
            OCI_KEY_CONTENT \
            OCI_REGION \
            OCI_SUBNET_ID \
            OCI_TENANCY_OCID \
            OCI_USER_OCID \
            SSH_PUBLIC_KEY
          do
            if [ -z "${!var:-}" ]; then
              echo "::error::Falta el secret $var"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Todos los secrets necesarios están configurados."

      # =========================================================
      # INSTALAR OCI CLI
      # =========================================================

      - name: Install OCI CLI
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/oci-cli"

          "$RUNNER_TEMP/oci-cli/bin/pip" \
            install --disable-pip-version-check oci-cli

          echo "$RUNNER_TEMP/oci-cli/bin" >> "$GITHUB_PATH"

      # =========================================================
      # CONFIGURAR AUTENTICACIÓN OCI
      # =========================================================

      - name: Configure OCI authentication
        shell: bash
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.oci"

          printf '%s\n' "$OCI_KEY_CONTENT" \
            > "$HOME/.oci/oci_api_key.pem"

          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF

          chmod 600 "$HOME/.oci/config"

          echo "OCI CLI:"
          oci --version

      # =========================================================
      # COMPROBAR AUTENTICACIÓN
      # =========================================================

      - name: Test OCI authentication
        shell: bash
        run: |
          set -euo pipefail

          echo "Comprobando autenticación con OCI..."

          oci iam region list \
            --output json \
            > /dev/null

          echo "Autenticación correcta."

      # =========================================================
      # COMPROBAR SI LA INSTANCIA YA EXISTE
      # =========================================================

      - name: Check existing instance
        id: existing
        shell: bash
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
        run: |
          set -euo pipefail

          echo "Buscando una instancia llamada '$INSTANCE_NAME'..."

          INSTANCE_ID=$(
            oci compute instance list \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --display-name "$INSTANCE_NAME" \
              --all \
              --output json |
            jq -r '
              [
                .data[]
                | select(."lifecycle-state" != "TERMINATED")
              ]
              | .[0].id // empty
            '
          )

          if [ -n "$INSTANCE_ID" ]; then
            echo "La instancia ya existe:"
            echo "$INSTANCE_ID"

            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          else
            echo "Todavía no existe la instancia."

            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # =========================================================
      # PROTECCIÓN DE LA CONFIGURACIÓN
      # =========================================================

      - name: Validate fixed VM configuration
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail

          if [ "$OCI_SHAPE" != "VM.Standard.A1.Flex" ] ||
             [ "$OCI_OCPUS" != "2" ] ||
             [ "$OCI_MEMORY_GB" != "12" ] ||
             [ "$OCI_BOOT_VOLUME_GB" != "180" ]; then

            echo "::error::La configuración de seguridad de la VM ha sido modificada."
            exit 1
          fi

          echo "Configuración validada:"
          echo
          echo "Shape:  $OCI_SHAPE"
          echo "OCPU:   $OCI_OCPUS"
          echo "RAM:    $OCI_MEMORY_GB GB"
          echo "Disco:  $OCI_BOOT_VOLUME_GB GB"

      # =========================================================
      # COMPROBAR A1 FLEX
      # =========================================================

      - name: Validate Ampere shape
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
        run: |
          set -euo pipefail

          echo "Comprobando $OCI_SHAPE..."

          COUNT=$(
            oci compute shape list \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --availability-domain "$OCI_AVAILABILITY_DOMAIN" \
              --shape "$OCI_SHAPE" \
              --output json |
            jq '.data | length'
          )

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::$OCI_SHAPE no está disponible en este Availability Domain."
            exit 1
          fi

          echo "$OCI_SHAPE está disponible como shape."

      # =========================================================
      # BUSCAR LA ÚLTIMA UBUNTU 24.04 ARM64
      # =========================================================

      - name: Find latest Ubuntu 24.04 ARM64 image
        if: steps.existing.outputs.exists == 'false'
        id: image
        shell: bash
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
        run: |
          set -euo pipefail

          echo "Buscando la última imagen Ubuntu 24.04 compatible con:"
          echo "$OCI_SHAPE"

          IMAGES=$(
            oci compute image list \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --shape "$OCI_SHAPE" \
              --all \
              --sort-by TIMECREATED \
              --sort-order DESC \
              --output json
          )

          IMAGE_ID=$(
            echo "$IMAGES" |
            jq -r '
              [
                .data[]
                | select(
                    ."display-name"
                    | test("^Canonical-Ubuntu-24\\.04-")
                  )
                | select(
                    (."display-name" | contains("Minimal")) | not
                  )
                | select(
                    (."display-name" | contains("-OKE-")) | not
                  )
              ]
              | sort_by(."time-created")
              | reverse
              | .[0].id // empty
            '
          )

          IMAGE_NAME=$(
            echo "$IMAGES" |
            jq -r '
              [
                .data[]
                | select(
                    ."display-name"
                    | test("^Canonical-Ubuntu-24\\.04-")
                  )
                | select(
                    (."display-name" | contains("Minimal")) | not
                  )
                | select(
                    (."display-name" | contains("-OKE-")) | not
                  )
              ]
              | sort_by(."time-created")
              | reverse
              | .[0]."display-name" // empty
            '
          )

          if [ -z "$IMAGE_ID" ]; then
            echo "::error::No se encontró una imagen Ubuntu 24.04 compatible con $OCI_SHAPE."
            exit 1
          fi

          echo "Imagen seleccionada:"
          echo "$IMAGE_NAME"
          echo "$IMAGE_ID"

          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"

      # =========================================================
      # PREPARAR CLAVE SSH
      # =========================================================

      - name: Prepare SSH public key
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          printf '%s\n' "$SSH_PUBLIC_KEY" \
            > "$RUNNER_TEMP/ssh_public_key.pub"

      # =========================================================
      # BUCLE DE INTENTOS
      # =========================================================

      - name: Try to get Ampere for up to 5h15m
        if: steps.existing.outputs.exists == 'false'
        id: launcher
        shell: bash
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ steps.image.outputs.image_id }}
        run: |
          set -euo pipefail

          # -----------------------------------------------------
          # Duración máxima del bucle
          # -----------------------------------------------------

          START_TIME=$(date +%s)

          # 5 horas y 15 minutos
          MAX_RUNTIME=$((5 * 60 * 60 + 15 * 60))

          END_TIME=$((START_TIME + MAX_RUNTIME))

          ATTEMPT=0

          # -----------------------------------------------------
          # Configuración A1 Flex
          # -----------------------------------------------------

          SHAPE_CONFIG=$(
            jq -nc \
              --argjson ocpus "$OCI_OCPUS" \
              --argjson memory "$OCI_MEMORY_GB" \
              '{
                ocpus: $ocpus,
                memoryInGBs: $memory
              }'
          )

          # -----------------------------------------------------
          # Configuración del boot volume
          # -----------------------------------------------------

          SOURCE_DETAILS=$(
            jq -nc \
              --arg image "$OCI_IMAGE_ID" \
              --argjson size "$OCI_BOOT_VOLUME_GB" \
              '{
                sourceType: "image",
                imageId: $image,
                bootVolumeSizeInGBs: $size,
                bootVolumeVpusPerGB: 10
              }'
          )

          # -----------------------------------------------------
          # Función para buscar la instancia
          # -----------------------------------------------------

          find_existing_instance() {

            oci compute instance list \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --display-name "$INSTANCE_NAME" \
              --all \
              --output json |
            jq -r '
              [
                .data[]
                | select(."lifecycle-state" != "TERMINATED")
              ]
              | .[0].id // empty
            '
          }

          # -----------------------------------------------------
          # Bucle principal
          # -----------------------------------------------------

          while [ "$(date +%s)" -lt "$END_TIME" ]; do

            ATTEMPT=$((ATTEMPT + 1))

            echo
            echo "========================================"
            echo "Intento #$ATTEMPT"
            echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "========================================"

            # ---------------------------------------------------
            # Comprobar si ya existe antes de solicitar otra
            # ---------------------------------------------------

            INSTANCE_ID=$(find_existing_instance || true)

            if [ -n "$INSTANCE_ID" ]; then

              echo
              echo "La instancia '$INSTANCE_NAME' ya existe:"
              echo "$INSTANCE_ID"

              echo "success=true" >> "$GITHUB_OUTPUT"
              echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

              exit 0
            fi

            # ---------------------------------------------------
            # Mostrar configuración
            # ---------------------------------------------------

            echo
            echo "Solicitando Ampere:"
            echo
            echo "Shape:  $OCI_SHAPE"
            echo "OCPU:   $OCI_OCPUS"
            echo "RAM:    $OCI_MEMORY_GB GB"
            echo "Disco:  $OCI_BOOT_VOLUME_GB GB"

            # ---------------------------------------------------
            # Solicitar instancia
            # ---------------------------------------------------

            set +e

            OUTPUT=$(
              oci compute instance launch \
                --availability-domain "$OCI_AVAILABILITY_DOMAIN" \
                --compartment-id "$OCI_COMPARTMENT_ID" \
                --subnet-id "$OCI_SUBNET_ID" \
                --shape "$OCI_SHAPE" \
                --shape-config "$SHAPE_CONFIG" \
                --source-details "$SOURCE_DETAILS" \
                --display-name "$INSTANCE_NAME" \
                --assign-public-ip true \
                --ssh-authorized-keys-file "$RUNNER_TEMP/ssh_public_key.pub" \
                --no-retry \
                --output json \
                2>&1
            )

            STATUS=$?

            set -e

            # ===================================================
            # CASO 1: INSTANCIA CONSEGUIDA
            # ===================================================

            if [ "$STATUS" -eq 0 ]; then

              INSTANCE_ID=$(
                echo "$OUTPUT" |
                jq -r '.data.id'
              )

              echo
              echo "========================================"
              echo "AMPERE CONSEGUIDA"
              echo "========================================"
              echo
              echo "Instance OCID:"
              echo "$INSTANCE_ID"

              echo "success=true" >> "$GITHUB_OUTPUT"
              echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

              exit 0
            fi

            # ===================================================
            # CASO 2: NO HAY CAPACIDAD
            # ===================================================

            if echo "$OUTPUT" |
               grep -Eqi \
               "out of host capacity|outofhostcapacity|out of.*capacity"; then

              # Esperar aleatoriamente entre 5 y 7 minutos.
              WAIT_SECONDS=$((300 + RANDOM % 121))

              echo
              echo "No hay capacidad de Ampere disponible."
              echo "Próximo intento en $WAIT_SECONDS segundos."

            # ===================================================
            # CASO 3: OCI HTTP 429
            # ===================================================

            elif echo "$OUTPUT" |
                 grep -Eqi \
                 "TooManyRequests|Too many requests|User-rate limit exceeded|status[^0-9]*429"; then

              # Si Oracle limita las peticiones,
              # dejamos descansar la API 15 minutos.
              WAIT_SECONDS=900

              echo
              echo "OCI está aplicando throttling (HTTP 429)."
              echo "Esperando 15 minutos antes del próximo intento."

            # ===================================================
            # CASO 4: ERROR DESCONOCIDO
            # ===================================================

            else

              echo
              echo "OCI devolvió un error inesperado:"
              echo
              echo "$OUTPUT"

              # Es posible que OCI aceptase la creación pero
              # se perdiese la respuesta.
              echo
              echo "Esperando 30 segundos antes de comprobar"
              echo "si la instancia fue creada..."

              sleep 30

              INSTANCE_ID=$(find_existing_instance || true)

              if [ -n "$INSTANCE_ID" ]; then

                echo
                echo "La instancia existe:"
                echo "$INSTANCE_ID"

                echo "success=true" >> "$GITHUB_OUTPUT"
                echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

                exit 0
              fi

              echo
              echo "::error::El error no corresponde a falta de capacidad ni throttling."

              exit "$STATUS"
            fi

            # ===================================================
            # CONTROLAR EL TIEMPO RESTANTE
            # ===================================================

            NOW=$(date +%s)

            REMAINING=$((END_TIME - NOW))

            if [ "$REMAINING" -le 0 ]; then
              break
            fi

            # No dormir más allá del límite de nuestra ronda.
            if [ "$WAIT_SECONDS" -gt "$REMAINING" ]; then
              WAIT_SECONDS="$REMAINING"
            fi

            sleep "$WAIT_SECONDS"

          done

          # =====================================================
          # FIN DE LA RONDA
          # =====================================================

          echo
          echo "========================================"
          echo "FIN DE ESTA RONDA"
          echo "========================================"
          echo
          echo "Han pasado aproximadamente 5h15m."
          echo "No se ha conseguido una Ampere todavía."
          echo
          echo "Una futura ejecución programada continuará"
          echo "intentándolo."

          echo "success=false" >> "$GITHUB_OUTPUT"

      # =========================================================
      # DESACTIVAR EL WORKFLOW CUANDO LA CONSIGAMOS
      # =========================================================

      - name: Disable launcher after success
        if: >
          steps.existing.outputs.exists == 'true' ||
          steps.launcher.outputs.success == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "La instancia Ampere ya existe."
          echo "Desactivando los intentos automáticos..."

          gh api \
            --method PUT \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/ampere-launcher.yml/disable"

          echo "Workflow desactivado."
