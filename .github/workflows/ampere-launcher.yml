name: OCI Ampere Launcher

on:
  # Permite ejecutarlo manualmente desde Actions
  workflow_dispatch:

  # GitHub permite como mínimo una ejecución cada 5 minutos
  schedule:
    - cron: "2-59/5 * * * *"

# Impide que dos ejecuciones intenten crear la VM simultáneamente
concurrency:
  group: oci-ampere-launcher
  cancel-in-progress: false

# Necesario para poder desactivar este workflow al conseguir la VM
permissions:
  contents: read
  actions: write

env:
  INSTANCE_NAME: ampere-free

  # Configuración FIJA de la VM.
  # No se obtiene de ningún secret ni input.
  OCI_SHAPE: VM.Standard.A1.Flex
  OCI_OCPUS: "2"
  OCI_MEMORY_GB: "12"
  OCI_BOOT_VOLUME_GB: "180"

  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

jobs:
  launch:
    name: Try to get Ampere A1
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      # ============================================================
      # 1. Comprobar que están todos los secrets
      # ============================================================

      - name: Validate secrets
        shell: bash
        env:
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          missing=0

          for var in \
            OCI_AVAILABILITY_DOMAIN \
            OCI_COMPARTMENT_ID \
            OCI_FINGERPRINT \
            OCI_KEY_CONTENT \
            OCI_REGION \
            OCI_SUBNET_ID \
            OCI_TENANCY_OCID \
            OCI_USER_OCID \
            SSH_PUBLIC_KEY
          do
            if [ -z "${!var:-}" ]; then
              echo "::error::Falta el secret $var"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Todos los secrets necesarios están configurados."

      # ============================================================
      # 2. Instalar OCI CLI
      # ============================================================

      - name: Install OCI CLI
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/oci-cli"

          "$RUNNER_TEMP/oci-cli/bin/pip" \
            install --disable-pip-version-check oci-cli

          echo "$RUNNER_TEMP/oci-cli/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 3. Configurar autenticación OCI
      # ============================================================

      - name: Configure OCI authentication
        shell: bash
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.oci"

          # Guardar temporalmente la API private key
          printf '%s\n' "$OCI_KEY_CONTENT" \
            > "$HOME/.oci/oci_api_key.pem"

          chmod 600 "$HOME/.oci/oci_api_key.pem"

          # Crear configuración de OCI CLI
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF

          chmod 600 "$HOME/.oci/config"

          echo "OCI CLI:"
          oci --version

      # ============================================================
      # 4. Comprobar autenticación
      # ============================================================

      - name: Test OCI authentication
        shell: bash
        run: |
          set -euo pipefail

          echo "Comprobando autenticación con OCI..."

          oci iam region list \
            --output json \
            > /dev/null

          echo "Autenticación correcta."

      # ============================================================
      # 5. Comprobar que A1 existe en el AD
      # ============================================================

      - name: Validate Ampere shape
        shell: bash
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
        run: |
          set -euo pipefail

          echo "Comprobando $OCI_SHAPE..."

          COUNT=$(
            oci compute shape list \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --availability-domain "$OCI_AVAILABILITY_DOMAIN" \
              --shape "$OCI_SHAPE" \
              --output json |
            jq '.data | length'
          )

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::$OCI_SHAPE no está disponible en este Availability Domain."
            exit 1
          fi

          echo "$OCI_SHAPE está disponible como shape en el AD."

      # ============================================================
      # 6. Comprobar si ya existe ampere-free
      # ============================================================

      - name: Check existing instance
        id: existing
        shell: bash
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
        run: |
          set -euo pipefail

          echo "Buscando una instancia llamada '$INSTANCE_NAME'..."

          INSTANCE_ID=$(
            oci compute instance list \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --display-name "$INSTANCE_NAME" \
              --all \
              --output json |
            jq -r '
              .data[]
              | select(."lifecycle-state" != "TERMINATED")
              | .id
            ' |
            head -n 1
          )

          if [ -n "$INSTANCE_ID" ]; then
            echo "Ya existe una instancia:"
            echo "$INSTANCE_ID"

            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          else
            echo "Todavía no existe la instancia."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # 7. Encontrar Ubuntu 24.04 ARM64 automáticamente
      # ============================================================

      - name: Find latest Ubuntu 24.04 ARM64 image
        if: steps.existing.outputs.exists == 'false'
        id: image
        shell: bash
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
        run: |
          set -euo pipefail

          echo "Buscando la última imagen Ubuntu 24.04 compatible con:"
          echo "$OCI_SHAPE"

          IMAGES=$(
            oci compute image list \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --shape "$OCI_SHAPE" \
              --all \
              --sort-by TIMECREATED \
              --sort-order DESC \
              --output json
          )

          # Queremos Ubuntu 24.04 normal:
          #   Canonical-Ubuntu-24.04-...
          #
          # No queremos:
          #   Minimal
          #   OKE
          IMAGE_ID=$(
            echo "$IMAGES" |
            jq -r '
              [
                .data[]
                | select(
                    ."display-name"
                    | test("^Canonical-Ubuntu-24\\.04-")
                  )
                | select(
                    (."display-name" | contains("Minimal")) | not
                  )
                | select(
                    (."display-name" | contains("-OKE-")) | not
                  )
              ]
              | sort_by(."time-created")
              | reverse
              | .[0].id // empty
            '
          )

          IMAGE_NAME=$(
            echo "$IMAGES" |
            jq -r '
              [
                .data[]
                | select(
                    ."display-name"
                    | test("^Canonical-Ubuntu-24\\.04-")
                  )
                | select(
                    (."display-name" | contains("Minimal")) | not
                  )
                | select(
                    (."display-name" | contains("-OKE-")) | not
                  )
              ]
              | sort_by(."time-created")
              | reverse
              | .[0]."display-name" // empty
            '
          )

          if [ -z "$IMAGE_ID" ]; then
            echo "::error::No se encontró una imagen Ubuntu 24.04 compatible con $OCI_SHAPE."
            exit 1
          fi

          echo "Imagen seleccionada:"
          echo "$IMAGE_NAME"
          echo "$IMAGE_ID"

          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 8. Preparar SSH public key
      # ============================================================

      - name: Prepare SSH public key
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          printf '%s\n' "$SSH_PUBLIC_KEY" \
            > "$RUNNER_TEMP/ssh_public_key.pub"

      # ============================================================
      # 9. Intentar crear Ampere
      # ============================================================

      - name: Try to launch Ampere A1
        if: steps.existing.outputs.exists == 'false'
        id: launch
        shell: bash
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ steps.image.outputs.image_id }}
        run: |
          set -uo pipefail

          echo "========================================"
          echo "Intentando crear Ampere"
          echo "========================================"
          echo
          echo "Shape:  $OCI_SHAPE"
          echo "OCPU:   $OCI_OCPUS"
          echo "RAM:    $OCI_MEMORY_GB GB"
          echo "Disco:  $OCI_BOOT_VOLUME_GB GB"
          echo

          # Protección adicional.
          # Si alguien modifica accidentalmente los valores anteriores,
          # el workflow se niega a crear una configuración diferente.
          if [ "$OCI_SHAPE" != "VM.Standard.A1.Flex" ] ||
             [ "$OCI_OCPUS" != "2" ] ||
             [ "$OCI_MEMORY_GB" != "12" ] ||
             [ "$OCI_BOOT_VOLUME_GB" != "180" ]; then

            echo "::error::La configuración de seguridad de la VM ha sido modificada."
            exit 1
          fi

          SHAPE_CONFIG=$(
            jq -nc \
              --argjson ocpus "$OCI_OCPUS" \
              --argjson memory "$OCI_MEMORY_GB" \
              '{
                ocpus: $ocpus,
                memoryInGBs: $memory
              }'
          )

          SOURCE_DETAILS=$(
            jq -nc \
              --arg image "$OCI_IMAGE_ID" \
              --argjson size "$OCI_BOOT_VOLUME_GB" \
              '{
                sourceType: "image",
                imageId: $image,
                bootVolumeSizeInGBs: $size,
                bootVolumeVpusPerGB: 10
              }'
          )

          set +e

          OUTPUT=$(
            oci compute instance launch \
              --availability-domain "$OCI_AVAILABILITY_DOMAIN" \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --subnet-id "$OCI_SUBNET_ID" \
              --shape "$OCI_SHAPE" \
              --shape-config "$SHAPE_CONFIG" \
              --source-details "$SOURCE_DETAILS" \
              --display-name "$INSTANCE_NAME" \
              --assign-public-ip true \
              --ssh-authorized-keys-file "$RUNNER_TEMP/ssh_public_key.pub" \
              --output json \
              2>&1
          )

          STATUS=$?

          set -e

          # ------------------------------------------------------
          # ÉXITO
          # ------------------------------------------------------

          if [ "$STATUS" -eq 0 ]; then
            echo
            echo "========================================"
            echo "AMPERE CONSEGUIDA"
            echo "========================================"
            echo

            INSTANCE_ID=$(
              echo "$OUTPUT" |
              jq -r '.data.id'
            )

            echo "Instance OCID:"
            echo "$INSTANCE_ID"

            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          # ------------------------------------------------------
          # SIN CAPACIDAD
          # ------------------------------------------------------

          if echo "$OUTPUT" |
             grep -Eqi \
             "out of host capacity|outofhostcapacity|out of.*capacity"; then

            echo
            echo "No hay capacidad de Ampere disponible."
            echo "Esto es normal."
            echo "GitHub Actions volverá a intentarlo."

            echo "created=false" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          # ------------------------------------------------------
          # ERROR REAL
          # ------------------------------------------------------

          echo
          echo "::error::OCI ha devuelto un error que NO es falta de capacidad."
          echo
          echo "$OUTPUT"

          exit "$STATUS"

      # ============================================================
      # 10. Desactivar workflow cuando ya tengamos la VM
      # ============================================================

      - name: Disable launcher after success
        if: >
          steps.existing.outputs.exists == 'true' ||
          steps.launch.outputs.created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "La instancia Ampere ya existe."
          echo "Desactivando los intentos automáticos..."

          gh api \
            --method PUT \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/ampere-launcher.yml/disable"

          echo "Workflow desactivado."
